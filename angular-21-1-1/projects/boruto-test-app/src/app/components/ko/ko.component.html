

<div style="margin: 5px 5px 5px 5px; width: 500px; height: 500px; border: solid; border-width: 1px 1px 1px 1px;position: relative;">
    <ko-button-group>
        <button (click)="setLeft()">Set align left</button>
        <br />
        <button (click)="setFocus()">Giv input focus</button>

        <br />
        <br />
        <input ko-decimal [(ko-value)]="mynumber" [align]="align()" [(ko-focus)]="infocus"/>
    </ko-button-group>
</div>

<div style="position: absolute; top: 550px; width: 550px; height: 250px; border: solid">
    <ko-alert align="center" class="warning">Her kommer der så en besked</ko-alert>
</div>

<div style="position: absolute; top: 550px; left: 600px; width: 550px; height: 250px; border: solid">
    <ko-header align="center" class="warning">Det er så en ko header besked</ko-header>
</div>
