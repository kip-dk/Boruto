<span style="display: none;"><ng-content></ng-content></span>
@if (icon() != '') {
    @if (type() == 'mat') {
        <mat-icon [ngClass]="classes()" [style]="inlineStyle()" fontSet="material-symbols-outlined">{{ icon() }}</mat-icon>
    }
    @if (type() == 'fa') {
        <i [ngClass]="classes()" [style]="inlineStyle()"></i>
    }
    @if (type() == 'font') {
        <span [class]="fontClass()" [style]="inlineStyle()">{{ icon() }}</span>
    }
}
